[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/parser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
codeatlas-domain = { path = "crates/domain" }
codeatlas-parser = { path = "crates/parser" }

uuid = { version = "1", features = ["v4", "v5", "serde"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
