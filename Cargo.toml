[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/parser",
    "crates/graph",
    "crates/git",
    "crates/indexer",
    "crates/storage",
    "crates/search",
    "crates/ai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
codeatlas-domain = { path = "crates/domain" }
codeatlas-parser = { path = "crates/parser" }
codeatlas-graph = { path = "crates/graph" }
codeatlas-git = { path = "crates/git" }
codeatlas-indexer = { path = "crates/indexer" }
codeatlas-storage = { path = "crates/storage" }
codeatlas-search = { path = "crates/search" }
codeatlas-ai = { path = "crates/ai" }

postgres = { version = "0.19", features = ["with-serde_json-1"] }
rusqlite = { version = "0.32", features = ["bundled"] }

blake3 = "1"
ignore = "0.4"
rayon = "1.10"
tracing = "0.1"

uuid = { version = "1", features = ["v4", "v5", "serde"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
